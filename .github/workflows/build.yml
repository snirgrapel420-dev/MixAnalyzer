name: Build Production Analyzer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPA_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - "build/ProductionAnalyzer_artefacts/Release/VST3/Production Analyzer.vst3"
          codesign --force --deep -s - "build/ProductionAnalyzer_artefacts/Release/AU/Production Analyzer.component"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ProductionAnalyzer-${{ runner.os }}
          path: |
            build/ProductionAnalyzer_artefacts/Release/VST3
            build/ProductionAnalyzer_artefacts/Release/AU
